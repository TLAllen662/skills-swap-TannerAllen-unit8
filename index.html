<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Skill Swap helps people learn from one another by sharing their skills.">
    <title>Skill Swap</title>
    <link rel="stylesheet" href="styles.css">
    <script src="skillswap.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="/" aria-label="Skill Swap home">Skill Swap</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#offerings">Browse skills</a></li>
          <li><a href="#footer">About</a></li>
        </ul>
      </nav>
    </header>

    <main id="home">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Share what you know. Learn something new.</h1>
        <p>Connect with your community to exchange skills and ideas.</p>
        <a class="hero-link" href="#offerings">Explore skill offerings</a>
      </section>

      <section class="offerings" id="offerings" aria-labelledby="offerings-title">
        <h2 id="offerings-title">Skill offerings</h2>
        <p>Discover skills shared by members of your community.</p>
        <div class="skill-filters" role="group" aria-label="Filter skills by category">
          <button type="button" class="skill-filter" data-category="All" aria-pressed="true">All</button>
          <button type="button" class="skill-filter" data-category="Programming" aria-pressed="false">Programming</button>
          <button type="button" class="skill-filter" data-category="Music" aria-pressed="false">Music</button>
          <button type="button" class="skill-filter" data-category="Career" aria-pressed="false">Career</button>
        </div>
        <div class="skill-list" id="skill-list" aria-live="polite"></div>
      </section>
    </main>

    <footer id="footer">
      <p>Skill Swap — learn and share together.</p>
    </footer>
  </body>
</html>
